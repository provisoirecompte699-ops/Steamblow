services:
  - type: web
    name: tcb-eaglercraft-gateway
    runtime: node
    plan: free
    rootDir: gateway-eaglercraft
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPSTREAM_WS_URL
        value: wss://youknowbro.eagler.host/
      - key: GATEWAY_PATH
        value: /websocket
      - key: MAX_CONNECTIONS
        value: "100"
